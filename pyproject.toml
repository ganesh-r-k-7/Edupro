[project]
name = "edupro"
version = "1.3.0"
description = "EduPro Predictive Analytics Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas==2.3.3",
    "numpy==2.5.4",
    "scikit-learn==1.9.1",
    "xgboost==3.4.1",
    "shap==0.54.1",
    "prophet==1.5.0",
    "plotly==7.1.0",
    "streamlit==1.65.0",
    "joblib==1.6.0",
    "openpyxl==3.1.5",
    "matplotlib==3.11.2",
    "seaborn==0.13.2",
    "statsmodels==0.15.0",
    "nbformat==5.11.1",
    "fastapi==0.116.0",
    "uvicorn==0.32.0",
    "pydantic==2.14.4",
    "pydantic-settings==2.9.1",
    "python-dotenv==1.0.1",
    "python-json-logger==2.0.7",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
edup-retrain = "edup.models.retrain:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["edup*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
    "ignore::UserWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "W", "UP", "B", "C4", "T20", "SIM", "ARG", "PTH", "ERA", "PL", "TRY",
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "T201", "T203",  # print statements allowed in scripts/notebooks
]
exclude = [
    ".venv*",
    "backups",
    "data",
    "models",
    "reports",
    "*.ipynb",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    ".venv*",
    "backups",
    "data",
    "models",
    "reports",
    "notebooks",
]