name: Model Retraining

on:
  schedule:
    - cron: '0 2 * * 0'  # Weekly Sunday 2 AM UTC
  workflow_dispatch:
    inputs:
      auto_promote:
        description: 'Automatically promote candidate if validation passes'
        type: boolean
        required: false
        default: false
      min_r2:
        description: 'Minimum R2 for promotion'
        type: string
        required: false
        default: '-1.0'
      max_rmse:
        description: 'Maximum RMSE for promotion'
        type: string
        required: false
        default: 'inf'
      max_mae:
        description: 'Maximum MAE for promotion'
        type: string
        required: false
        default: 'inf'

permissions:
  contents: read

jobs:
  retrain:
    name: Retrain Enrollment Model
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: model-retraining
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.lock"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Verify data availability
        run: |
          python -c "
          from edup.data import load_processed_data
          try:
              df = load_processed_data()
              print(f'Data loaded: {len(df)} rows, {len(df.columns)} columns')
              print(f'Courses: {df[\"CourseID\"].nunique()}')
          except Exception as e:
              print(f'Data unavailable: {e}')
              exit(1)
          "

      - name: Run manual retraining (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          MIN_R2: ${{ github.event.inputs.min_r2 }}
          MAX_RMSE: ${{ github.event.inputs.max_rmse }}
          MAX_MAE: ${{ github.event.inputs.max_mae }}
        run: |
          python -m edup.models.retrain retrain \
            --auto-promote=${{ github.event.inputs.auto_promote }} \
            --min-r2=${MIN_R2} \
            --max-rmse=${MAX_RMSE} \
            --max-mae=${MAX_MAE}

      - name: Run scheduled retraining (cron)
        if: github.event_name == 'schedule'
        run: |
          python -m edup.models.retrain scheduled

      - name: Report retraining status
        if: always()
        run: |
          echo "=== Retraining Job Summary ==="
          echo "Event: ${{ github.event_name }}"
          echo "Status: ${{ job.status }}"
          python -m edup.models.retrain status

  validate_candidate:
    name: Validate Candidate Model
    needs: retrain
    if: needs.retrain.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.lock"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Check for candidate model
        id: candidate
        run: |
          python -c "
          from edup.models import get_registry
          registry = get_registry()
          versions = registry.list_versions()
          candidate = None
          for v in versions:
              if v.status == 'candidate':
                  candidate = v
                  break
          if candidate:
              print(f'candidate_version={candidate.version}')
              print(f'candidate_model={candidate.model_name}')
              print('has_candidate=true')
          else:
              print('has_candidate=false')
          " >> $GITHUB_OUTPUT

      - name: Validate candidate model
        if: steps.candidate.outputs.has_candidate == 'true'
        env:
          MIN_R2: ${{ github.event.inputs.min_r2 }}
          MAX_RMSE: ${{ github.event.inputs.max_rmse }}
          MAX_MAE: ${{ github.event.inputs.max_mae }}
        run: |
          python -c "
          from edup.models import get_registry
          from edup.models.registry import PromotionCriteria
          import os
          registry = get_registry()
          version = '${{ steps.candidate.outputs.candidate_version }}'
          criteria = PromotionCriteria(
              min_r2=float(os.environ.get('MIN_R2', '-1.0')),
              max_rmse=float(os.environ.get('MAX_RMSE', 'inf')),
              max_mae=float(os.environ.get('MAX_MAE', 'inf')),
              must_beat_baseline=True,
          )
          valid, issues = registry.validate_candidate(version, criteria)
          print(f'Candidate: {version}')
          print(f'Valid: {valid}')
          if issues:
              for issue in issues:
                  print(f'  - {issue}')
          if not valid:
              exit(1)
          "

  report:
    name: Report
    needs: [retrain, validate_candidate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.lock"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Final status report
        run: |
          echo "=== R4.5 Retraining Workflow Report ==="
          echo "Retraining job: ${{ needs.retrain.result }}"
          echo "Validation job: ${{ needs.validate_candidate.result }}"
          python -m edup.models.retrain status